<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience in background -->
  <circle cx="150" cy="100" r="220" fill="url(#glowGrad1)">
    <animate attributeName="cx" values="120;200;120" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;140;80" dur="10s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="300" r="240" fill="url(#glowGrad2)">
    <animate attributeName="cx" values="1080;980;1080" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="320;260;320" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic / Animated Flow Graphic in Background (Subtle Bidding Flow Nodes) -->
  <g opacity="0.45">
    <!-- Connecting flow paths -->
    <path d="M 80 340 C 350 290, 450 370, 750 320 S 1050 350, 1150 310" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="15s" repeatCount="indefinite" />
    </path>
    <path d="M 120 70 C 400 130, 600 50, 850 110 S 1080 70, 1140 100" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="18s" repeatCount="indefinite" />
    </path>

    <!-- Floating DSP metric particles -->
    <circle cx="280" cy="80" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="70" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="350" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="330" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content Block (High z-index, clear readability) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="19" class="badge-label">ADTECH • CURATED LIST</text>
    </g>

    <!-- Title Header -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" class="title-text">Awesome <tspan fill="url(#accentGrad)">Demand-Side Platform</tspan> (DSP)</text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" class="subtitle-text">Programmatic Advertising • Real-Time Bidding (RTB) • OpenRTB • Media Buying</text>
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Real-Time Bidding -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" />
        <text x="36" y="26" class="pill-text">⚡ Real-Time Bidding</text>
      </g>

      <!-- Pill 2: OpenRTB Engines -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#818cf8" />
        <text x="36" y="26" class="pill-text">🌐 OpenRTB Engines</text>
      </g>

      <!-- Pill 3: SaaS DSP Leaders -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#a855f7" />
        <text x="36" y="26" class="pill-text">🏢 SaaS DSP Leaders</text>
      </g>

      <!-- Pill 4: Open-Source Bidders -->
      <g transform="translate(585, 0)">
        <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#34d399" />
        <text x="36" y="26" class="pill-text">🔓 Open-Source Bidders</text>
      </g>

      <!-- Pill 5: Omnichannel & CTV -->
      <g transform="translate(795, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#fbbf24" />
        <text x="36" y="26" class="pill-text">📺 Omnichannel &amp; CTV</text>
      </g>
    </g>

    <!-- Bottom border subtle accent line -->
    <rect x="0" y="340" width="1040" height="1" fill="#334155" opacity="0.4" />
  </g>
</svg>
